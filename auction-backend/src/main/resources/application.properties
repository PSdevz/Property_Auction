spring.application.name=auction-backend
spring.datasource.url=jdbc:mysql://localhost:3306/property_auction
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password01}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.profiles.active=dev
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Email Settings
spring.mail.username=${MAIL_USERNAME:testapproject123@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.from=${MAIL_USERNAME:testapproject123@gmail.com}

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY}

# --- NEW: Image Upload Limits ---
# Allow large Base64 JSON payloads (Increase Tomcat max post size)
server.tomcat.max-http-form-post-size=20MB
# Allow large file uploads generally
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB